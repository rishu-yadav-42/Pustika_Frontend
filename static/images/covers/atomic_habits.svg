    <circle cx="0" cy="0" r="60" fill="none" stroke="#f97316" stroke-width="3" stroke-dasharray="6,8"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="3,5"/>
    <circle cx="0" cy="0" r="8" fill="#f97316"/>
