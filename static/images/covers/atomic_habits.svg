  <!-- Header Text -->
  <text x="150" y="70" font-family="'Inter', sans-serif" font-weight="900" font-size="28" fill="#1e293b" text-anchor="middle" letter-spacing="1">Atomic</text>
  <text x="150" y="105" font-family="'Inter', sans-serif" font-weight="900" font-size="34" fill="#ea580c" text-anchor="middle" letter-spacing="2">Habits</text>
  
