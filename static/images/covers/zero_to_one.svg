<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450">
  <rect width="300" height="450" fill="#312e81"/>
  
  <text x="150" y="150" font-family="'Inter', sans-serif" font-weight="900" font-size="40" fill="#ffffff" text-anchor="middle">Zero</text>
  <text x="150" y="200" font-family="'Inter', sans-serif" font-size="20" font-weight="600" fill="#a5b4fc" text-anchor="middle">to</text>
  <text x="150" y="260" font-family="'Inter', sans-serif" font-weight="900" font-size="48" fill="#38bdf8" text-anchor="middle">One</text>
  
